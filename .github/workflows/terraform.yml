name: Terraform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.16.x"

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init -backend=false

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Validate (cluster stack)
      working-directory: cluster
      run: |
        terraform init -backend=false
        terraform validate

    - name: Terraform Test (modules/component)
      working-directory: modules/component
      run: |
        terraform init -backend=false
        terraform test

    - name: Terraform Test (modules/buildkitd)
      working-directory: modules/buildkitd
      run: |
        terraform init -backend=false
        terraform test
